name: regression

# 模拟器回归：替代人工真机回归中"机器能判"的那部分（见 docs/发版规范.md §3 脚注）。
# 不跑 Gradle，构建复用 build.sh；回归脚本为 tools/ci/regression.sh。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'java/**'
      - 'AndroidManifest.xml'
      - 'build.sh'
      - 'tools/**'
      - '.github/workflows/regression.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'java/**'
      - 'AndroidManifest.xml'
      - 'build.sh'

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Install zig (用于交叉编译 jni)
        run: |
          python3 -m pip install --user ziglang
          echo "ZIG=$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')" >> $GITHUB_ENV
          chmod +x "$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')" || true

      - name: Restore signing keystore (固定证书，覆盖升级前置)
        env:
          KS_B64: ${{ secrets.ONESTAR_KS_B64 }}
          KS_PASS: ${{ secrets.ONESTAR_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p ci-keys
            printf '%s' "$KS_B64" | base64 -d > ci-keys/onestar-debug.keystore
            echo "ONESTAR_KS=$PWD/ci-keys/onestar-debug.keystore" >> "$GITHUB_ENV"
            echo "ONESTAR_KS_PASS=${KS_PASS:-android}" >> "$GITHUB_ENV"
            echo "ONESTAR_KS_ALIAS=onestar-debug" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 ONESTAR_KS_B64，现场生成一次性 debug keystore（基线包与待测包共用，覆盖安装仍可实测，但不可上架）"
            KS="$RUNNER_TEMP/ci-onestar.keystore"
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias onestar-debug \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OneStar CI, O=OneStar, C=CN" >/dev/null 2>&1
            echo "ONESTAR_KS=$KS" >> "$GITHUB_ENV"
            echo "ONESTAR_KS_PASS=android" >> "$GITHUB_ENV"
            echo "ONESTAR_KS_ALIAS=onestar-debug" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: bash ./test.sh

      - name: Build APK (x86_64，仅供模拟器回归；发布包仍为 arm64)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          BUILD_TOOLS: '35.0.0'
          ABIS: x86_64
        run: bash ./build.sh

      - name: Verify signing certificate
        if: ${{ env.ONESTAR_KS != '' }}
        run: python3 tools/verify_apk_signature.py build/onestar-*-signed.apk

      - name: Build baseline APK (v0.12.2-rc1 源码，同 ABI 同签名)
        continue-on-error: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          BUILD_TOOLS: '35.0.0'
          ABIS: x86_64
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/baseline
          git clone --depth 1 --branch v0.12.2-rc1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" base-src
          ( cd base-src && bash ./build.sh )
          cp base-src/build/onestar-*-signed.apk build/baseline/base.apk
          echo "基线包: $(stat -c %s build/baseline/base.apk) bytes（$(sha256sum build/baseline/base.apk | cut -c1-12)…）"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onestar-apk
          path: build/onestar-*-signed.apk
          if-no-files-found: error

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: base-apk
          path: build/baseline/base.apk
          if-no-files-found: warn

  regression:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: onestar-apk
          path: build

      - name: Enable KVM (模拟器硬件加速)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download baseline APK (v0.12.2-rc1 源码构建，同 ABI 同签名)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: base-apk
          path: build/regression

      - name: Run regression on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect -noaudio -no-window -camera-back none -camera-front none
          script: bash tools/ci/regression.sh

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: build/regression/
          if-no-files-found: warn
