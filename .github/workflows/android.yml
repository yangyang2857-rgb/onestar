name: build

# 同样不使用 Gradle：手工装 build-tools 与 platform，直接跑 build.sh。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 platform-tools'

      - name: Install zig (用于交叉编译 jni)
        run: |
          python3 -m pip install --user ziglang
          echo "ZIG=$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')" >> $GITHUB_ENV
          chmod +x "$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')" || true

      - name: Unit tests (纯 JVM，无 Gradle)
        run: ./test.sh

      - name: Build APK (aapt2 + javac + d8 + apksigner)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          BUILD_TOOLS: '34.0.0'
        run: ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onestar-apk
          path: build/onestar-*-signed.apk
          if-no-files-found: error
